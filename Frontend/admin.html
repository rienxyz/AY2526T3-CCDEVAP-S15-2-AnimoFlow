<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimoFlow · Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="dark-mode.css">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>

    <div class="container-fluid py-4">
        <div class="page-header mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h1><i class="bi bi-shield-lock me-2"></i>Admin Panel</h1>
                <p class="text-muted">Manage reports, users, and view analytics across the campus.</p>
            </div>
            <button class="btn btn-back" id="backToDashboardBtn">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </button>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-primary"><i class="bi bi-file-text"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalReports">0</span>
                        <span class="stat-label">Total Reports</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-success"><i class="bi bi-clock-history"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="activeReports">0</span>
                        <span class="stat-label">Active (30 min)</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-warning"><i class="bi bi-building"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="buildingsWithReports">0</span>
                        <span class="stat-label">Buildings Active</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-danger"><i class="bi bi-people-fill"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalUsers">0</span>
                        <span class="stat-label">Unique Users</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-lg-6">
                <div class="card-custom">
                    <div class="card-header-custom"><i class="bi bi-bar-chart me-2"></i>Reports by Building</div>
                    <div class="p-3"><canvas id="buildingChart" height="250"></canvas></div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card-custom">
                    <div class="card-header-custom"><i class="bi bi-pie-chart me-2"></i>Queue Status Distribution</div>
                    <div class="p-3"><canvas id="statusChart" height="250"></canvas></div>
                </div>
            </div>
        </div>

        <div class="card-custom">
            <div class="card-header-custom d-flex justify-content-between align-items-center">
                <span><i class="bi bi-table me-2"></i>All Reports</span>
                <div>
                    <button class="btn-refresh me-2" id="refreshTableBtn"><i class="bi bi-arrow-repeat"></i> Refresh</button>
                    <button class="btn-filter text-danger" id="clearAllBtn"><i class="bi bi-trash"></i> Clear All</button>
                </div>
            </div>
            <div class="p-3">
                <div class="table-responsive">
                    <table id="reportsTable" class="display responsive nowrap" style="width:100%">
                        <thead>
                            <tr><th>ID</th><th>Building</th><th>Elevator</th><th>Status</th><th>User</th><th>Time</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="liveToast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Notification</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle Dark Mode">🌙</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin-script.js"></script>
</body>
</html>
