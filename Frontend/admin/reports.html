<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimoFlow · Manage Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
    <link rel="stylesheet" href="shared.css">
    <style>
        body { padding-top: 70px; }
        @media (max-width: 768px) { body { padding-top: 60px; } }
    </style>
</head>
<body>

    <!-- Sticky Navbar -->
    <nav class="navbar navbar-expand-lg sticky-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-shield-lock me-2"></i>AnimoFlow Admin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="reports.html"><i class="bi bi-file-text"></i> Reports</a></li>
                    <li class="nav-item"><a class="nav-link" href="users.html"><i class="bi bi-people"></i> Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="buildings.html"><i class="bi bi-building"></i> Buildings</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-light btn-sm" id="adminLogoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
                    <button class="btn btn-outline-light btn-sm" id="backToMainBtn"><i class="bi bi-arrow-left"></i> Main</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <h2><i class="bi bi-file-text me-2"></i>Manage Reports</h2>
            <div>
                <button class="btn btn-success me-2" id="refreshBtn"><i class="bi bi-arrow-repeat"></i> Refresh</button>
                <button class="btn btn-danger" id="clearAllBtn"><i class="bi bi-trash"></i> Clear All</button>
            </div>
        </div>

        <!-- Filter Row -->
        <div class="row g-3 mb-4">
            <div class="col-md-3"><select class="form-select" id="filterBuilding"><option value="all">All Buildings</option></select></div>
            <div class="col-md-3"><select class="form-select" id="filterStatus"><option value="all">All Status</option><option value="short">🟢 Short</option><option value="medium">🟡 Medium</option><option value="long">🔴 Long</option></select></div>
            <div class="col-md-3"><select class="form-select" id="filterUser"><option value="all">All Users</option></select></div>
            <div class="col-md-3"><button class="btn btn-primary w-100" id="applyFilterBtn"><i class="bi bi-funnel"></i> Apply Filters</button></div>
        </div>

        <!-- Reports Table -->
        <div class="card-custom">
            <div class="card-body">
                <div class="table-responsive">
                    <table id="reportsTable" class="display responsive nowrap" style="width:100%">
                        <thead>
                            <tr><th>ID</th><th>Building</th><th>Elevator</th><th>Status</th><th>User</th><th>Time</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editReportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Edit Report</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editReportForm">
                        <input type="hidden" id="editReportId">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Building</label>
                            <select class="form-select" id="editBuilding">
                                <option value="St. La Salle Hall">St. La Salle Hall</option>
                                <option value="Henry Sy Hall">Henry Sy Hall</option>
                                <option value="Yuchengco Hall">Yuchengco Hall</option>
                                <option value="St. Joseph Hall">St. Joseph Hall</option>
                                <option value="Velasco Hall">Velasco Hall</option>
                                <option value="St. Miguel Hall">St. Miguel Hall</option>
                                <option value="Gokongwei Hall">Gokongwei Hall</option>
                                <option value="STRC">STRC</option>
                                <option value="Razon Sports Center">Razon Sports Center</option>
                                <option value="Andrew Gonzalez Hall">Andrew Gonzalez Hall</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Elevator</label>
                            <input type="text" class="form-control" id="editElevator" required placeholder="e.g. LS-East-1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Queue Status</label>
                            <select class="form-select" id="editStatus">
                                <option value="short">🟢 Short</option>
                                <option value="medium">🟡 Medium</option>
                                <option value="long">🔴 Long</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn"><i class="bi bi-check-lg"></i> Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle Dark Mode">🌙</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="reports.js"></script>
</body>
</html>
