<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimoFlow · Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="public/css/dark-mode.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 450px;
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12);
            border: 1px solid rgba(0,104,55,0.1);
            padding: 2rem;
        }
        .card h3 {
            color: #006837;
            font-weight: 700;
        }
        .btn-primary {
            background: #006837;
            border: none;
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #008a47;
        }
        .btn-back {
            background: transparent;
            border: 1.5px solid #d4dfcd;
            border-radius: 12px;
            padding: 0.6rem;
            font-weight: 500;
            color: #4a5b4a;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-back:hover {
            background: #e8f3ef;
            border-color: #006837;
            color: #006837;
        }
        body.dark-mode .card {
            background: #1e2a4a;
            border-color: #2a3a5a;
        }
        body.dark-mode .card h3 {
            color: #64b5f6;
        }
        body.dark-mode .form-control {
            background: #1a2a4a;
            border-color: #2a4a6a;
            color: #e8e8e8;
        }
        body.dark-mode .form-label {
            color: #64b5f6;
        }
        body.dark-mode .btn-back {
            color: #a8b8c8;
            border-color: #2a4a6a;
        }
        body.dark-mode .btn-back:hover {
            background: #1a3a5a;
            border-color: #4a7a9a;
            color: #64b5f6;
        }
        body.dark-mode .text-muted {
            color: #a8b8c8 !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3><i class="bi bi-key me-2"></i>Reset Password</h3>
        <p class="text-muted mb-4">Enter your DLSU email to reset your password. Your password will be reset to: <strong>reset123456</strong></p>

        <form id="resetForm">
            <div class="mb-3">
                <label class="form-label fw-bold">DLSU Email Address</label>
                <input type="email" class="form-control" id="resetEmail" placeholder="juandelacruz@dlsu.edu.ph" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="resetBtn">
                <i class="bi bi-arrow-repeat me-2"></i>Reset Password
            </button>
        </form>

        <div id="resetMessage" class="mt-3" style="display: none;"></div>

        <button class="btn-back mt-3" id="backToLoginBtn">
            <i class="bi bi-arrow-left me-1"></i> Back to Login
        </button>
    </div>

    <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle Dark Mode">🌙</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
